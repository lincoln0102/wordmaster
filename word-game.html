<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>听写乐园 · Spell Park</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Noto+Sans+SC:wght@500;700;900&family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
<style>
  :root{
    --bg1:#fff6e9; --bg2:#ffeede; --paper:#fffdf8;
    --ink:#3a3530; --ink-soft:#8a8076;
    --coral:#ff7a6b; --sky:#5ac8e8; --grass:#79c779;
    --grape:#b18fe0; --honey:#ffb84d; --rose:#ff9ec4;
    --good:#43c08b; --bad:#ff8585;
    --shadow:0 10px 0 rgba(0,0,0,.06), 0 14px 30px rgba(120,90,40,.16);
    --shadow-sm:0 5px 0 rgba(0,0,0,.05), 0 8px 16px rgba(120,90,40,.14);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    font-family:"Fredoka","Noto Sans SC",sans-serif; color:var(--ink);
    background:
      radial-gradient(circle at 12% 16%, #ffe9c9 0, transparent 38%),
      radial-gradient(circle at 88% 10%, #d7f1ff 0, transparent 40%),
      radial-gradient(circle at 80% 90%, #e3fbe0 0, transparent 42%),
      linear-gradient(160deg,var(--bg1),var(--bg2));
    background-attachment:fixed; min-height:100%; overflow-x:hidden;
    user-select:none; -webkit-user-select:none;
  }
  body::before{content:""; position:fixed; inset:0; pointer-events:none; opacity:.5; z-index:0;
    background-image:radial-gradient(rgba(180,140,80,.12) 1.4px, transparent 1.4px); background-size:24px 24px;}
  .wrap{position:relative; z-index:1; max-width:760px; margin:0 auto; padding:18px 16px 70px; min-height:100%;}

  /* header */
  header{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:16px;}
  .logo{display:flex; align-items:center; gap:11px;}
  .logo .mark{width:54px; height:54px; border-radius:18px; display:grid; place-items:center; font-size:30px;
    background:linear-gradient(150deg,#ffd27a,#ff9b6b); box-shadow:var(--shadow-sm); transform:rotate(-6deg);}
  .logo h1{font-family:"ZCOOL KuaiLe","Fredoka",cursive; font-size:26px; line-height:1; font-weight:400;}
  .logo .en{font-size:12px; letter-spacing:3px; color:var(--ink-soft); font-weight:600; margin-top:3px;}
  .lvl{display:flex; flex-direction:column; align-items:flex-end; gap:5px;}
  .lvl .badge{background:var(--paper); padding:8px 16px; border-radius:999px; box-shadow:var(--shadow-sm);
    font-weight:700; font-size:16px; font-family:"Noto Sans SC"; display:flex; align-items:center; gap:7px;}
  .lvl .bar{width:130px; height:9px; background:#fff; border-radius:999px; overflow:hidden; box-shadow:inset 0 2px 4px rgba(0,0,0,.08);}
  .lvl .bar > i{display:block; height:100%; background:linear-gradient(90deg,#ffd27a,#ff9b6b); width:0%; transition:width .5s;}

  .panel{background:var(--paper); border-radius:28px; box-shadow:var(--shadow); padding:22px;}
  .screen{animation:pop .42s cubic-bezier(.2,1.3,.4,1) both;}
  @keyframes pop{from{opacity:0; transform:translateY(16px) scale(.97);} to{opacity:1; transform:none;}}
  .sub{font-size:13px; letter-spacing:1px; color:var(--ink-soft); font-weight:700; margin-bottom:11px; font-family:"Noto Sans SC";}

  /* today strip */
  .today{display:flex; gap:12px; margin-bottom:16px;}
  .stat{flex:1; background:var(--paper); border-radius:20px; box-shadow:var(--shadow-sm); padding:14px; text-align:center;}
  .stat .n{font-size:30px; font-weight:700; line-height:1;}
  .stat .t{font-size:12px; color:var(--ink-soft); font-weight:700; font-family:"Noto Sans SC"; margin-top:5px;}

  /* category chips */
  .cats{display:flex; flex-wrap:wrap; gap:9px;}
  .chip{cursor:pointer; font-family:"Noto Sans SC"; font-weight:700; font-size:14px; border:none;
    background:#fff; color:var(--ink-soft); padding:9px 15px; border-radius:999px; box-shadow:var(--shadow-sm); transition:.12s;}
  .chip:active{transform:scale(.95);}
  .chip.on{color:#fff;}
  .chip[data-c="shapes"].on{background:var(--coral);} .chip[data-c="nature"].on{background:var(--sky);}
  .chip[data-c="acts"].on{background:var(--grass);} .chip[data-c="words"].on{background:var(--grape);}
  .chip[data-c="phonics"].on{background:var(--honey);} .chip[data-c="all"].on{background:#ff8fae;}

  /* mode buttons */
  .modes{display:grid; grid-template-columns:1fr; gap:13px; margin-top:14px;}
  .mode{cursor:pointer; border:none; text-align:left; color:var(--ink); background:var(--paper);
    border-radius:24px; padding:18px; box-shadow:var(--shadow-sm); transition:transform .12s;
    display:flex; align-items:center; gap:15px; font-family:inherit; position:relative;}
  .mode:active{transform:translateY(4px) scale(.99);}
  .mode .ic{width:58px; height:58px; flex:none; border-radius:17px; display:grid; place-items:center; font-size:31px;}
  .mode h3{font-size:20px; font-weight:700; font-family:"Noto Sans SC";}
  .mode p{font-size:13px; color:var(--ink-soft); margin-top:2px; font-family:"Noto Sans SC"; font-weight:500;}
  .mode.hero{background:linear-gradient(150deg,#fff,#fff4e2); border:2.5px solid #ffd9a6;}
  .mode.hero .ic{background:linear-gradient(150deg,#7fd6f0,#4bb8e0); color:#fff; font-size:34px; width:64px; height:64px;}
  .m-err .ic{background:#ffe2dc;} .m-flash .ic{background:#e3f6df;} .m-mc .ic{background:#efe6fb;}
  .mode .tag{margin-left:auto; font-size:13px; font-weight:700; font-family:"Noto Sans SC";
    background:#ffe1e1; color:#e06464; padding:5px 12px; border-radius:999px; flex:none;}

  .btn{cursor:pointer; font-family:"Noto Sans SC"; font-weight:700; border:none; border-radius:20px;
    padding:15px 24px; font-size:18px; box-shadow:var(--shadow-sm); transition:transform .1s;
    display:inline-flex; align-items:center; justify-content:center; gap:9px;}
  .btn:active{transform:translateY(4px);}
  .btn-primary{background:linear-gradient(150deg,#ffce6a,#ff8d5e); color:#fff;}
  .btn-ghost{background:#fff; color:var(--ink-soft);}
  .btn-blue{background:linear-gradient(150deg,#7fd6f0,#4bb8e0); color:#fff;}

  /* game top */
  .gbar{display:flex; align-items:center; gap:11px; margin-bottom:14px;}
  .iconbtn{width:48px; height:48px; flex:none; border-radius:15px; border:none; cursor:pointer; font-size:21px;
    background:var(--paper); box-shadow:var(--shadow-sm); font-family:inherit;}
  .iconbtn:active{transform:translateY(3px);}
  .progress{flex:1; height:16px; background:#fff; border-radius:999px; box-shadow:inset 0 2px 5px rgba(0,0,0,.07); overflow:hidden;}
  .progress > i{display:block; height:100%; width:0%; border-radius:999px; background:linear-gradient(90deg,#7fd6f0,#4bb8e0); transition:width .4s;}
  .score-pill{font-weight:700; font-variant-numeric:tabular-nums; font-size:16px; min-width:54px; text-align:right; font-family:"Noto Sans SC";}

  /* combo */
  .combo{position:fixed; right:18px; top:96px; z-index:30; text-align:center; pointer-events:none; opacity:0; transition:opacity .25s;}
  .combo.show{opacity:1;}
  .combo .x{font-family:"ZCOOL KuaiLe"; font-size:40px; color:var(--coral); text-shadow:0 4px 0 rgba(0,0,0,.06); line-height:1;}
  .combo .l{font-size:13px; font-weight:700; color:var(--honey); font-family:"Noto Sans SC";}

  /* dictation */
  .dict-top{text-align:center; padding:18px 14px 10px;}
  .speaker{margin:0 auto; width:108px; height:108px; border-radius:50%; border:none; cursor:pointer;
    background:linear-gradient(150deg,#7fd6f0,#4bb8e0); color:#fff; font-size:50px; box-shadow:var(--shadow); transition:transform .12s;}
  .speaker:active{transform:scale(.92);}
  .speaker.ring{animation:ring 1s ease;}
  @keyframes ring{0%{box-shadow:0 0 0 0 rgba(91,200,232,.5),var(--shadow);}100%{box-shadow:0 0 0 36px rgba(91,200,232,0),var(--shadow);}}
  .replay{display:flex; gap:10px; justify-content:center; margin-top:12px;}
  .replay .btn{padding:10px 18px; font-size:15px;}
  .meaning{margin-top:14px; font-family:"ZCOOL KuaiLe"; font-size:34px; color:var(--coral);}
  .meaning .emoji{font-size:40px; margin-right:6px; font-family:"Fredoka";}
  .meaning.hidden{filter:blur(9px);}

  .slots{display:flex; flex-wrap:wrap; gap:7px; justify-content:center; min-height:62px; margin:18px 0 6px; padding:6px;}
  .slot{width:46px; height:58px; border-radius:13px; background:#fff; box-shadow:inset 0 2px 6px rgba(0,0,0,.06);
    display:grid; place-items:center; font-size:30px; font-weight:700; border:2.5px solid #efe3cf; font-family:"Fredoka"; transition:.15s;}
  .slot.cursor{border-color:var(--sky); border-style:dashed;}
  .slot.fill{border-color:#ffce6a; background:#fff7e9;}
  .slot.gap{box-shadow:none; border:none; width:18px; min-width:18px;}
  .slot.sep{box-shadow:none; border:none; background:transparent; color:var(--ink-soft);}
  .slot.ok{border-color:var(--good); background:#e3fbef; color:#1e9c6b;}
  .slot.no{border-color:var(--bad); background:#ffeaea; color:#d4504f;}
  .shake{animation:shake .4s;}
  @keyframes shake{0%,100%{transform:translateX(0);}20%,60%{transform:translateX(-8px);}40%,80%{transform:translateX(8px);}}

  /* keyboard */
  .kb{display:flex; flex-direction:column; gap:8px; margin-top:6px;}
  .kb-row{display:flex; gap:6px; justify-content:center;}
  .key{flex:1; max-width:62px; height:54px; border:none; border-radius:13px; cursor:pointer;
    background:linear-gradient(160deg,#fff,#fdeed8); box-shadow:var(--shadow-sm); color:var(--ink);
    font-family:"Fredoka"; font-weight:600; font-size:23px; display:grid; place-items:center; transition:transform .08s;}
  .key:active{transform:translateY(3px); background:#ffe9cf;}
  .key.wide{max-width:none; flex:1.6; font-size:18px; font-family:"Noto Sans SC"; font-weight:700;}
  .key.del{background:linear-gradient(160deg,#fff0f0,#ffdede); color:#d4504f;}
  .key.go{background:linear-gradient(150deg,#ffce6a,#ff8d5e); color:#fff;}
  .key.press{transform:translateY(3px); background:#ffd9a6; box-shadow:0 2px 0 rgba(0,0,0,.05);}
  .kbtip{text-align:center; font-size:12px; color:var(--ink-soft); font-family:"Noto Sans SC"; font-weight:600; margin:2px 0 8px;}

  /* toast */
  .toast{position:fixed; left:50%; top:34%; transform:translate(-50%,-50%); z-index:50;
    font-family:"ZCOOL KuaiLe"; font-size:54px; pointer-events:none; opacity:0; text-shadow:0 6px 0 rgba(0,0,0,.08);}
  .toast.show{animation:toast 1.05s ease forwards;}
  @keyframes toast{0%{opacity:0; transform:translate(-50%,-30%) scale(.5);}25%{opacity:1; transform:translate(-50%,-50%) scale(1.12);}70%{opacity:1;}100%{opacity:0; transform:translate(-50%,-66%) scale(1);}}

  /* flashcard */
  .fc{perspective:1400px; height:300px; margin:6px 0 18px; cursor:pointer;}
  .fc-inner{position:relative; width:100%; height:100%; transition:transform .55s cubic-bezier(.4,1,.4,1); transform-style:preserve-3d;}
  .fc.flip .fc-inner{transform:rotateY(180deg);}
  .fc-face{position:absolute; inset:0; border-radius:28px; backface-visibility:hidden; display:flex; flex-direction:column; align-items:center; justify-content:center; box-shadow:var(--shadow); padding:22px;}
  .fc-front{background:var(--paper);} .fc-back{background:linear-gradient(160deg,#fff3df,#ffe7d4); transform:rotateY(180deg);}
  .fc .emoji{font-size:70px; line-height:1; margin-bottom:6px;} .fc .word{font-size:46px; font-weight:700;}
  .fc .blend{color:var(--honey);} .fc .cn{font-family:"ZCOOL KuaiLe"; font-size:42px; color:var(--coral);}
  .fc .hint{font-size:14px; color:var(--ink-soft); font-weight:600; margin-top:12px; font-family:"Noto Sans SC";}
  .dots{display:flex; gap:4px; margin-top:8px;}
  .dot{width:11px; height:11px; border-radius:50%; background:#e7d8c2;}
  .dot.on{background:var(--honey);}
  .fc-nav{display:flex; gap:11px;} .fc-nav .btn{flex:1;}

  /* options */
  .prompt{text-align:center; padding:26px 16px; margin-bottom:16px; border-radius:26px; background:var(--paper); box-shadow:var(--shadow-sm);}
  .prompt .label{font-size:13px; color:var(--ink-soft); font-weight:700; font-family:"Noto Sans SC"; margin-bottom:9px;}
  .prompt .emoji{font-size:64px;} .prompt .big{font-family:"ZCOOL KuaiLe"; font-size:52px; color:var(--coral);}
  .options{display:grid; grid-template-columns:repeat(2,1fr); gap:12px;}
  .opt{cursor:pointer; font-family:"Fredoka","Noto Sans SC"; font-weight:600; font-size:24px; background:var(--paper);
    border:3px solid transparent; border-radius:20px; padding:20px 12px; box-shadow:var(--shadow-sm); transition:transform .1s; color:var(--ink); min-height:72px;}
  .opt:active{transform:translateY(3px);}
  .opt.correct{background:#e3fbef; border-color:var(--good); color:#1e9c6b;}
  .opt.wrong{background:#ffeaea; border-color:var(--bad); color:#d4504f;}

  /* error book list */
  .errlist{display:flex; flex-direction:column; gap:10px; margin-top:6px;}
  .errrow{display:flex; align-items:center; gap:13px; background:#fff; border-radius:18px; padding:13px 15px; box-shadow:var(--shadow-sm);}
  .errrow .em{font-size:30px; flex:none;}
  .errrow .w{font-family:"Fredoka"; font-weight:700; font-size:22px;}
  .errrow .c{font-size:14px; color:var(--ink-soft); font-family:"Noto Sans SC"; font-weight:600;}
  .errrow .mas{margin-left:auto; display:flex; gap:3px; flex:none;}
  .mdot{width:13px; height:13px; border-radius:50%; background:#eadcc6;}
  .mdot.on{background:var(--honey);}
  .errrow .miss{font-size:13px; color:#e06464; font-weight:700; font-family:"Noto Sans SC"; flex:none;}
  .empty{text-align:center; padding:30px 10px; color:var(--ink-soft); font-family:"Noto Sans SC"; font-weight:700;}
  .empty .big{font-size:64px; margin-bottom:10px;}

  /* result */
  .result{text-align:center; padding:18px 12px;}
  .result .trophy{font-size:88px; animation:bounce 1s infinite alternate;}
  @keyframes bounce{to{transform:translateY(-12px);}}
  .result h2{font-family:"ZCOOL KuaiLe"; font-size:38px; margin:6px 0;}
  .result .score{font-size:20px; color:var(--ink-soft); font-weight:700; font-family:"Noto Sans SC"; margin-bottom:6px;}
  .result .gained{display:inline-flex; gap:8px; align-items:center; background:#fff7e9; padding:10px 22px; border-radius:999px; font-size:22px; font-weight:700; margin-bottom:18px;}
  .result .recap{text-align:left; background:#fff5f5; border-radius:18px; padding:14px 16px; margin:0 0 18px; font-family:"Noto Sans SC";}
  .result .recap .h{font-weight:700; color:#e06464; margin-bottom:6px; font-size:15px;}
  .result .recap .ww{display:inline-block; background:#fff; border-radius:10px; padding:4px 10px; margin:3px 4px 0 0; font-family:"Fredoka"; font-weight:700; font-size:16px;}
  .result .btn{margin:5px;}
  .confetti{position:fixed; top:-20px; width:12px; height:18px; z-index:40; pointer-events:none; border-radius:3px;}

  @media(max-width:480px){
    .logo h1{font-size:22px;} .key{height:48px; font-size:20px;} .slot{width:40px; height:52px; font-size:26px;}
    .meaning{font-size:28px;} .opt{font-size:21px;}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">
      <div class="mark">🎧</div>
      <div><h1>听写乐园</h1><div class="en">SPELL&nbsp;PARK</div></div>
    </div>
    <div class="lvl">
      <div class="badge"><span id="lvlEmoji">🌱</span><span id="lvlName">小芽</span></div>
      <div class="bar"><i id="lvlBar"></i></div>
    </div>
  </header>
  <div id="app"></div>
</div>

<div class="toast" id="toast"></div>
<div class="combo" id="combo"><div class="x" id="comboX">×2</div><div class="l">连击!</div></div>

<script>
/* ============================ 词库 ============================ */
const WORDS = [
  {en:"circle",cn:"圆形",emoji:"⭕",cat:"shapes"},
  {en:"square",cn:"正方形",emoji:"🟧",cat:"shapes"},
  {en:"triangle",cn:"三角形",emoji:"🔺",cat:"shapes"},
  {en:"star",cn:"星形",emoji:"⭐",cat:"shapes"},
  {en:"rectangle",cn:"长方形",emoji:"▭",cat:"shapes"},
  {en:"house",cn:"房子",emoji:"🏠",cat:"shapes"},
  {en:"sky",cn:"天空",emoji:"☁️",cat:"nature"},
  {en:"sea",cn:"大海",emoji:"🌊",cat:"nature"},
  {en:"mountain",cn:"高山",emoji:"⛰️",cat:"nature"},
  {en:"river",cn:"小河",emoji:"🏞️",cat:"nature"},
  {en:"plant a tree",cn:"种树",emoji:"🌳",cat:"acts"},
  {en:"have a picnic",cn:"野餐",emoji:"🧺",cat:"acts"},
  {en:"ice-skate",cn:"滑冰",emoji:"⛸️",cat:"acts"},
  {en:"ski",cn:"滑雪",emoji:"🎿",cat:"acts"},
  {en:"like",cn:"像",emoji:"💗",cat:"words"},
  {en:"in",cn:"在…里",emoji:"📦",cat:"words"},
  {en:"colour",cn:"颜色",emoji:"🎨",cat:"words"},
  {en:"too",cn:"也",emoji:"➕",cat:"words"},
  {en:"season",cn:"季节",emoji:"🍂",cat:"words"},
  {en:"park",cn:"公园",emoji:"🛝",cat:"words"},
  {en:"turn off",cn:"关掉",emoji:"🔌",cat:"phonics",blend:"-ff"},
  {en:"take off",cn:"脱掉",emoji:"🧥",cat:"phonics",blend:"-ff"},
  {en:"clothes",cn:"衣服",emoji:"👕",cat:"phonics",blend:"cl-"},
  {en:"plant",cn:"种植",emoji:"🌱",cat:"phonics",blend:"pl-"},
  {en:"gloves",cn:"手套",emoji:"🧤",cat:"phonics",blend:"gl-"},
  {en:"blue",cn:"蓝色",emoji:"🔵",cat:"phonics",blend:"bl-"},
  {en:"flower",cn:"花",emoji:"🌷",cat:"phonics",blend:"fl-"},
  {en:"slowly",cn:"慢慢地",emoji:"🐌",cat:"phonics",blend:"sl-"},
];
const CATS={all:{name:"全部",emoji:"🌈"},shapes:{name:"形状",emoji:"🔷"},nature:{name:"大自然",emoji:"🏔️"},
  acts:{name:"活动",emoji:"⛷️"},words:{name:"常用词",emoji:"💬"},phonics:{name:"拼读",emoji:"🔤"}};
const WMAP={}; WORDS.forEach(w=>WMAP[w.en]=w);
const LEVELS=[
  {min:0,emoji:"🌱",name:"小芽"},{min:60,emoji:"🌿",name:"新苗"},{min:180,emoji:"🌻",name:"小能手"},
  {min:400,emoji:"🏅",name:"听写达人"},{min:800,emoji:"🏆",name:"单词大王"},{min:1500,emoji:"👑",name:"听写王"}];

/* ============================ 存档 ============================ */
const DEFAULT={points:0, today:{date:"", count:0}, words:{}};
let DB = load();
function load(){
  try{ const r=JSON.parse(localStorage.getItem("sp_v2")); if(r&&r.words) return Object.assign({},DEFAULT,r); }catch(e){}
  return JSON.parse(JSON.stringify(DEFAULT));
}
function save(){ try{ localStorage.setItem("sp_v2", JSON.stringify(DB)); }catch(e){} }
function todayStr(){ const d=new Date(); return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate(); }
function ensureToday(){ const t=todayStr(); if(DB.today.date!==t){ DB.today={date:t,count:0}; } }
function st(en){ if(!DB.words[en]) DB.words[en]={seen:0,correct:0,wrong:0,streak:0,mastery:0}; return DB.words[en]; }
ensureToday();

/* ============================ 头部等级 ============================ */
function curLevel(){ let l=LEVELS[0]; for(const x of LEVELS) if(DB.points>=x.min) l=x; return l; }
function refreshHeader(){
  const lv=curLevel(); const idx=LEVELS.indexOf(lv); const next=LEVELS[idx+1];
  document.getElementById("lvlEmoji").textContent=lv.emoji;
  document.getElementById("lvlName").textContent=lv.name;
  let pct=100; if(next){ pct=Math.min(100,Math.round((DB.points-lv.min)/(next.min-lv.min)*100)); }
  document.getElementById("lvlBar").style.width=pct+"%";
}
function addPoints(n){ DB.points+=n; save(); refreshHeader(); }
refreshHeader();

/* ============================ 声音 ============================ */
let audioCtx=null;
function beep(f,d=0.12,t="sine",v=0.2){try{audioCtx=audioCtx||new(window.AudioContext||window.webkitAudioContext)();
  const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type=t;o.frequency.value=f;o.connect(g);g.connect(audioCtx.destination);
  g.gain.setValueAtTime(v,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+d);
  o.start();o.stop(audioCtx.currentTime+d);}catch(e){}}
function sfxRight(){beep(660,0.1,"triangle",.18);setTimeout(()=>beep(990,0.16,"triangle",.18),90);}
function sfxWrong(){beep(190,0.22,"sawtooth",.12);}
function sfxTap(){beep(540,0.04,"sine",.08);}
function sfxKey(){beep(660,0.03,"sine",.06);}
function sfxWin(){[523,659,784,1047,1319].forEach((f,i)=>setTimeout(()=>beep(f,0.18,"triangle",.18),i*110));}
function sfxLevel(){[784,988,1175,1568].forEach((f,i)=>setTimeout(()=>beep(f,0.2,"triangle",.2),i*130));}

function speak(text,rate){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);
  u.lang="en-GB";u.rate=rate||0.82;u.pitch=1.05;const vs=speechSynthesis.getVoices();
  const v=vs.find(v=>/en-GB/i.test(v.lang))||vs.find(v=>/en[-_]US/i.test(v.lang))||vs.find(v=>/^en/i.test(v.lang));
  if(v)u.voice=v;speechSynthesis.speak(u);}catch(e){}}
if("speechSynthesis" in window){speechSynthesis.onvoiceschanged=()=>{};speechSynthesis.getVoices();}

/* ============================ 工具 ============================ */
const app=document.getElementById("app"), toastEl=document.getElementById("toast");
const comboEl=document.getElementById("combo"), comboX=document.getElementById("comboX");
let selectedCats=new Set(["all"]);
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=(Math.random()*(i+1))|0;[a[i],a[j]]=[a[j],a[i]];}return a;}
function pool(){ if(selectedCats.has("all")||selectedCats.size===0) return WORDS.slice(); return WORDS.filter(w=>selectedCats.has(w.cat)); }
function toast(t){toastEl.textContent=t;toastEl.classList.remove("show");void toastEl.offsetWidth;toastEl.classList.add("show");}
function showCombo(n){ if(n<2){comboEl.classList.remove("show");return;} comboX.textContent="×"+n; comboEl.classList.add("show"); }
function hideCombo(){comboEl.classList.remove("show");}
function celebrate(){const cs=["#ff7a6b","#5ac8e8","#79c779","#ffb84d","#b18fe0","#ff9ec4"];
  for(let i=0;i<80;i++){const c=document.createElement("div");c.className="confetti";c.style.left=Math.random()*100+"vw";
  c.style.background=cs[(Math.random()*cs.length)|0];c.style.transform=`rotate(${Math.random()*360}deg)`;
  const dur=2+Math.random()*1.6,delay=Math.random()*0.5;c.style.animation=`fall ${dur}s linear ${delay}s forwards`;
  document.body.appendChild(c);setTimeout(()=>c.remove(),(dur+delay)*1000+200);}}
const fs=document.createElement("style");fs.textContent="@keyframes fall{to{transform:translateY(110vh) rotate(720deg);opacity:.4;}}";document.head.appendChild(fs);

/* 加权抽样：错得多、没掌握、没见过的词更容易出现 */
function weightOf(en){ const s=st(en); let w=1; w+=s.wrong*3; w+=(5-s.mastery)*1.2; if(s.seen===0) w+=2.5;
  if(s.streak>=2) w-=1.5; return Math.max(0.4,w); }
function weightedPick(items,n){ const arr=items.slice(); const out=[];
  n=Math.min(n,arr.length);
  for(let k=0;k<n;k++){ let tot=0; const ws=arr.map(w=>{const x=weightOf(w.en);tot+=x;return x;});
    let r=Math.random()*tot, idx=0; for(let i=0;i<arr.length;i++){r-=ws[i];if(r<=0){idx=i;break;}}
    out.push(arr[idx]); arr.splice(idx,1); }
  return out; }
function errorWords(){ return WORDS.filter(w=>{const s=DB.words[w.en]; return s && (s.wrong>0 && s.mastery<4);}); }

        <div><h3>错词复习</h3><p>专攻最容易写错的词</p></div>

  const catsEl=document.getElementById("cats");
  Object.entries(CATS).forEach(([k,v])=>{const b=document.createElement("button");

      else{selectedCats.delete("all");selectedCats.has(k)?selectedCats.delete(k):selectedCats.add(k);if(selectedCats.size===0)selectedCats=new Set(["all"]);}
      home();};
    catsEl.appendChild(b);});
  document.querySelectorAll(".mode").forEach(m=>m.onclick=()=>{sfxTap();route(m.dataset.go);});
}
function route(go){
  if(go==="dictation") return dictation(weightedPick(pool(),Math.min(10,pool().length)),"听写闯关");
  if(go==="review"){ const e=errorWords(); if(e.length===0){toast("还没有错词 🎉");setTimeout(home,400);return;}
    return dictation(weightedPick(e,Math.min(10,e.length)),"错词复习"); }
  if(go==="flash") return flashGame();
  if(go==="zh2en") return quizGame();
}

/* 顶部条 */
function gbar(pct,label){return `<div class="gbar"><button class="iconbtn" id="backBtn">🏠</button>
  <div class="progress"><i id="prog" style="width:${pct}%"></i></div>
  <span class="score-pill" id="scorePill">${label}</span></div>`;}

/* ============================ 听写主玩法 ============================ */
function dictation(initial, titleLabel){
  let queue = initial.slice();       // 本轮要练的词（错的会重新插回）
  const target = initial.length;     // 需要清掉的不同单词数
  const clearedSet = new Set();
  let sessionPts=0, combo=0, sessionWrong=new Set();
  let typed=[];                      // 当前已输入的字母
  let curChars=[], curTotal=0;       // 当前单词的字母与需输入字母数
  let busy=false;                    // 判定中，锁住输入避免重复触发

  // —— 物理键盘（蓝牙键盘）支持 ——
  function onKey(e){
    if(!document.getElementById("slots")) return;          // 仅在听写界面响应
    const k=e.key;
    if(k==="Backspace"){ e.preventDefault(); deleteLetter(); return; }
    if(k==="Enter"){ e.preventDefault(); check(curChars,curTotal); return; }
    if(k===" "){ e.preventDefault(); return; }             // 空格已自动补位，忽略并防滚动
    if(k && k.length===1 && /[a-zA-Z]/.test(k)){ e.preventDefault(); inputLetter(k.toLowerCase()); }
  }
  document.addEventListener("keydown", onKey);
  function cleanup(){ document.removeEventListener("keydown", onKey); }

  function flashKey(ch){
    const kb=document.getElementById("kb"); if(!kb) return;
    const el = ch==="DEL" ? kb.querySelector(".key.del")
             : [...kb.querySelectorAll(".key")].find(k=>k.textContent===ch);
    if(el){ el.classList.add("press"); setTimeout(()=>el.classList.remove("press"),140); }
  }
  function inputLetter(ch){
    if(busy || typed.length>=curTotal) return;
    typed.push(ch); sfxKey(); drawSlots(curChars); flashKey(ch);
    if(typed.length>=curTotal) setTimeout(()=>check(curChars,curTotal),180);
  }
  function deleteLetter(){
    if(busy || typed.length===0) return;
    typed.pop(); sfxKey(); drawSlots(curChars); flashKey("DEL");
  }

  function render(){
    if(clearedSet.size>=target || queue.length===0){ return finish(); }
    const w=queue[0];
    const chars=w.en.split("");
    typed=[]; busy=false; curChars=chars; curTotal=letterPositions(chars).length;
    const pct=Math.round(clearedSet.size/target*100);
    app.innerHTML=`
    <div class="screen">
      ${gbar(pct, clearedSet.size+"/"+target)}
      <div class="panel" style="padding-top:14px">
        <div class="dict-top">
          <button class="speaker ring" id="sp">🔊</button>
          <div class="replay">
            <button class="btn btn-ghost" id="again">再听一次</button>
            <button class="btn btn-ghost" id="slow">🐢 慢速</button>
            <button class="btn btn-ghost" id="peek">👀 提示</button>
          </div>
          <div class="meaning hidden" id="meaning"><span class="emoji">${w.emoji}</span>${w.cn}</div>
        </div>
        <div class="slots" id="slots"></div>
        <div class="kbtip">🎹 蓝牙键盘可直接敲字母 · Enter 确定 · Backspace 删除</div>
        <div class="kb" id="kb"></div>
      </div>
    </div>`;
    document.getElementById("backBtn").onclick=()=>{sfxTap();hideCombo();cleanup();home();};
    document.getElementById("sp").onclick=()=>{speak(w.en);ringSpeaker();};
    document.getElementById("again").onclick=()=>{sfxTap();speak(w.en);ringSpeaker();};
    document.getElementById("slow").onclick=()=>{sfxTap();speak(w.en,0.5);};
    document.getElementById("peek").onclick=()=>{sfxTap();document.getElementById("meaning").classList.toggle("hidden");};
    buildKeyboard();
    drawSlots(curChars);
    setTimeout(()=>{speak(w.en);ringSpeaker();},350);
  }
  function ringSpeaker(){const s=document.getElementById("sp");if(!s)return;s.classList.remove("ring");void s.offsetWidth;s.classList.add("ring");}

  // 字母槽位：非字母（空格/连字符）自动显示，只需输入字母
  function letterPositions(chars){ const pos=[]; chars.forEach((c,i)=>{ if(/[a-z]/i.test(c)) pos.push(i); }); return pos; }
  function drawSlots(chars){
    const slotsEl=document.getElementById("slots"); if(!slotsEl) return; slotsEl.innerHTML="";
    let li=0;
    chars.forEach((c)=>{
      const d=document.createElement("div");
      if(c===" "){ d.className="slot gap"; }
      else if(c==="-"){ d.className="slot sep"; d.textContent="-"; }
      else{
        if(li<typed.length){ d.className="slot fill"; d.textContent=typed[li]; }
        else if(li===typed.length){ d.className="slot cursor"; }
        else{ d.className="slot"; }
        li++;
      }
      slotsEl.appendChild(d);
    });
  }
  function buildKeyboard(){
    const rows=["qwertyuiop","asdfghjkl","zxcvbnm"];
    const kb=document.getElementById("kb"); kb.innerHTML="";
    rows.forEach((r,ri)=>{
      const row=document.createElement("div"); row.className="kb-row";
      if(ri===2){ // 在末行加删除
        const del=document.createElement("button"); del.className="key wide del"; del.textContent="⌫ 删除";
        del.onclick=()=>deleteLetter();
        row.appendChild(del);
      }
      r.split("").forEach(ch=>{
        const k=document.createElement("button"); k.className="key"; k.textContent=ch;
        k.onclick=()=>inputLetter(ch);
        row.appendChild(k);
      });
      if(ri===2){
        const go=document.createElement("button"); go.className="key wide go"; go.textContent="✓ 确定";
        go.onclick=()=>check(curChars,curTotal);
        row.appendChild(go);
      }
      kb.appendChild(row);
    });
  }
  function answerFromTyped(chars){ // 把输入的字母塞回原词形（含空格/连字符）
    let li=0; return chars.map(c=>{ if(/[a-z]/i.test(c)){ const ch=typed[li]!==undefined?typed[li]:"_"; li++; return ch; } return c; }).join(""); }

  function check(chars,totalLetters){
    if(busy) return;
    const w=queue[0];
    if(typed.length<totalLetters){ const s=document.getElementById("slots"); if(s){s.classList.add("shake");} sfxWrong(); setTimeout(()=>{if(s)s.classList.remove("shake");},400); return; }
    busy=true;
    const ans=answerFromTyped(chars).toLowerCase();
    const slotsEl=document.getElementById("slots");
    const s=st(w.en); s.seen++;
    if(ans===w.en.toLowerCase()){
      // 正确
      [...slotsEl.children].forEach(el=>{ if(el.classList.contains("fill")) el.classList.add("ok"); });
      sfxRight(); combo++; s.correct++; s.streak++;
      const firstTry = !sessionWrong.has(w.en);
      if(firstTry) s.mastery=Math.min(5,s.mastery+1);
      const mult = combo>=6?3 : combo>=3?2 : 1;
      const gain = (firstTry?10:5)*mult;
      sessionPts+=gain; addPoints(gain);
      DB.today.count++; save();
      clearedSet.add(w.en); queue.shift();
      showCombo(combo>=2?mult:0);
      toast(combo>=3?["连击!","好厉害!","太强了!","完美!"][(Math.random()*4)|0]:["对啦!","真棒!","正确!"][(Math.random()*3)|0]);
      document.getElementById("prog").style.width=Math.round(clearedSet.size/target*100)+"%";
      document.getElementById("scorePill").textContent=clearedSet.size+"/"+target;
      speak(w.en);
      setTimeout(render,900);
    } else {
      // 错误 → 记错词，连击清零，本词稍后重新出现
      [...slotsEl.children].forEach(el=>{ if(el.classList.contains("fill")) el.classList.add("no"); });
      sfxWrong(); combo=0; hideCombo();
      s.wrong++; s.streak=0; s.mastery=Math.max(0,s.mastery-1); save();
      sessionWrong.add(w.en);
      toast("再听听看 💪");
      // 显示正确拼写（用绿色把整词写出来）
      setTimeout(()=>{
        const sl=document.getElementById("slots"); if(!sl) return;
        sl.innerHTML="";
        chars.forEach(c=>{ const d=document.createElement("div");
          if(c===" "){d.className="slot gap";} else if(c==="-"){d.className="slot sep";d.textContent="-";}
          else{d.className="slot ok";d.textContent=c;} sl.appendChild(d); });
      },420);
      speak(w.en);
      // 把这个词重新插回队列（3 个之后再考一次）
      const word=queue.shift();
      const insertAt=Math.min(queue.length, 3);
      queue.splice(insertAt,0,word);
      document.getElementById("scorePill").textContent=clearedSet.size+"/"+target;
      setTimeout(render,1700);
    }
  }
  function finish(){
    cleanup();
    hideCombo();
    const wrongList=[...sessionWrong];
    const pct = target? Math.round(clearedSet.size/Math.max(target,clearedSet.size)*100):100;
    resultScreen({
      title: titleLabel,
      cleared: clearedSet.size,
      total: target,
      points: sessionPts,
      wrongList,
      perfect: wrongList.length===0
    });
  }
  render();
}

/* ============================ 结算 ============================ */
let lastLevelName=curLevel().name;
function resultScreen(o){
  sfxWin();
  const leveledUp = curLevel().name!==lastLevelName;
  if(o.perfect||o.cleared===o.total) celebrate();
  let trophy,title;
  if(o.perfect){trophy="🏆";title="全对！太厉害了！";}
  else if(o.wrongList.length<=1){trophy="🥇";title="非常棒！";}
  else {trophy="🌟";title="完成啦，继续加油！";}
  const recap = o.wrongList.length? `
    <div class="recap"><div class="h">📕 这些词进了错词本，下次还会出现：</div>
    ${o.wrongList.map(en=>`<span class="ww">${en} <span style="color:var(--coral);font-family:'ZCOOL KuaiLe'">${WMAP[en].cn}</span></span>`).join("")}
    </div>`:`<div class="recap" style="background:#eefcf3"><div class="h" style="color:#1e9c6b">🎉 全部一次答对，没有错词！</div></div>`;
  app.innerHTML=`
  <div class="panel result screen">
    <div class="trophy">${trophy}</div>
    <h2>${title}</h2>
    <div class="score">清掉 ${o.cleared} / ${o.total} 个词</div>
    <div class="gained">⭐ 本轮 +${o.points} 分</div>
    ${leveledUp?`<div class="gained" style="background:#eaf6ff;color:#2b8fc7">🎖️ 升级啦：${curLevel().emoji} ${curLevel().name}</div>`:""}
    ${recap}
    <div>
      <button class="btn btn-blue" id="again">🔁 再练一轮</button>
      <button class="btn btn-ghost" id="home">🏠 回首页</button>
    </div>
  </div>`;
  if(leveledUp){ sfxLevel(); lastLevelName=curLevel().name; }
  document.getElementById("home").onclick=()=>{sfxTap();home();};
  document.getElementById("again").onclick=()=>{sfxTap();
    if(o.title==="错词复习"){route("review");} else {route("dictation");}};
}

/* ============================ 学习卡片 ============================ */
function flashGame(){
  const list=shuffle(pool()); let i=0;
  function render(){
    const w=list[i]; const s=st(w.en);
    const word=w.blend? w.en.replace(new RegExp(w.blend.replace(/-/g,""),"i"),m=>`<span class="blend">${m}</span>`):w.en;
    const dots=Array.from({length:5},(_,k)=>`<div class="dot ${k<s.mastery?'on':''}"></div>`).join("");
    app.innerHTML=`
    <div class="screen">
      ${gbar(((i+1)/list.length)*100,(i+1)+" / "+list.length)}
      <div class="fc" id="fc"><div class="fc-inner">
        <div class="fc-face fc-front">
          <div class="emoji">${w.emoji}</div><div class="word">${word}</div>
          ${w.blend?`<div class="hint">字母组合：${w.blend}</div>`:""}
          <div class="dots">${dots}</div>
          <div class="hint">👆 点卡片看中文 · 🔊 听发音</div>
        </div>
        <div class="fc-face fc-back"><div class="emoji">${w.emoji}</div><div class="cn">${w.cn}</div><div class="hint">${w.en}</div></div>
      </div></div>
      <div class="fc-nav">
        <button class="btn btn-ghost" id="prev">⬅️</button>
        <button class="btn btn-primary" id="speak">🔊 读一读</button>
        <button class="btn btn-ghost" id="next">➡️</button>
      </div>
    </div>`;
    document.getElementById("backBtn").onclick=()=>{sfxTap();home();};
    const fc=document.getElementById("fc"); fc.onclick=()=>{sfxTap();fc.classList.toggle("flip");};
    document.getElementById("speak").onclick=e=>{e.stopPropagation();speak(w.en);};
    document.getElementById("prev").onclick=()=>{sfxTap();i=(i-1+list.length)%list.length;render();};
    document.getElementById("next").onclick=()=>{sfxTap();i=(i+1)%list.length;render();};
    speak(w.en);
  }
  render();
}

/* ============================ 看中文选英文 ============================ */
function quizGame(){
  const list=shuffle(pool()); let i=0,correct=0,combo=0,pts=0;
  function render(){
    const w=list[i];
    const opts=shuffle([w,...shuffle(WORDS.filter(x=>x.en!==w.en)).slice(0,3)]);
    app.innerHTML=`
    <div class="screen">
      ${gbar((i/list.length)*100,(i+1)+" / "+list.length)}
      <div class="prompt"><div class="label">这个中文，英语怎么说？</div>
        <div class="emoji">${w.emoji}</div><div class="big">${w.cn}</div></div>
      <div class="options" id="opts"></div>
    </div>`;
    document.getElementById("backBtn").onclick=()=>{sfxTap();hideCombo();home();};
    const oe=document.getElementById("opts");
    opts.forEach(o=>{const b=document.createElement("button");b.className="opt";b.textContent=o.en;
      b.onclick=()=>{ [...oe.children].forEach(x=>x.disabled=true);
        const s=st(w.en); s.seen++;
        if(o.en===w.en){b.classList.add("correct");sfxRight();correct++;combo++;
          const g=10*(combo>=3?2:1);pts+=g;addPoints(g);DB.today.count++;
          s.correct++;s.streak++;s.mastery=Math.min(5,s.mastery+1);save();
          showCombo(combo>=3?2:0);toast("对啦!");speak(w.en);setTimeout(next,850);}
        else{b.classList.add("wrong");sfxWrong();combo=0;hideCombo();
          s.wrong++;s.streak=0;s.mastery=Math.max(0,s.mastery-1);save();
          [...oe.children].find(x=>x.textContent===w.en).classList.add("correct");speak(w.en);setTimeout(next,1400);}
      };
      oe.appendChild(b);});
  }
  function next(){i++; if(i>=list.length){hideCombo();return resultScreen({title:"看中文选英文",cleared:correct,total:list.length,points:pts,wrongList:[],perfect:correct===list.length});} render();}
  render();
}

home();
